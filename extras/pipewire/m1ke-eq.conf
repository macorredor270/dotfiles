# EQ M1ke para reggaeton: sink virtual -> DAC USB Jieli (UACDemoV1.0)
# Quitar: systemctl --user disable --now filter-chain
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "M1ke EQ"
            media.name       = "M1ke EQ"
            filter.graph = {
                nodes = [
                    { type = builtin name = preamp  label = linear      control = { "Mult" = 0.708 "Add" = 0.0 } }
                    { type = builtin name = hp      label = bq_highpass control = { "Freq" = 30.0   "Q" = 0.707 "Gain" = 0.0 } }
                    { type = builtin name = bass    label = bq_lowshelf control = { "Freq" = 80.0   "Q" = 0.7   "Gain" = 3.5 } }
                    { type = builtin name = mud     label = bq_peaking  control = { "Freq" = 220.0  "Q" = 1.0   "Gain" = -2.0 } }
                    { type = builtin name = voice   label = bq_peaking  control = { "Freq" = 3000.0 "Q" = 1.0   "Gain" = 1.0 } }
                    { type = builtin name = air     label = bq_highshelf control = { "Freq" = 9000.0 "Q" = 0.7  "Gain" = 1.5 } }
                ]
                links = [
                    { output = "preamp:Out" input = "hp:In" }
                    { output = "hp:Out"     input = "bass:In" }
                    { output = "bass:Out"   input = "mud:In" }
                    { output = "mud:Out"    input = "voice:In" }
                    { output = "voice:Out"  input = "air:In" }
                ]
                inputs  = [ "preamp:In" ]
                outputs = [ "air:Out" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name   = "m1ke_eq"
                media.class = Audio/Sink
            }
            playback.props = {
                node.name   = "m1ke_eq_out"
                node.passive = true
                target.object = "alsa_output.usb-Jieli_Technology_UACDemoV1.0_4150344B3237310D-00.analog-stereo"
            }
        }
    }
]
