# ── Fuente ──
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.0

# ── Ventana ──
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size no
initial_window_width  1100
initial_window_height 680
background_opacity 1.0

# ── Cursor y scroll ──
cursor_shape     beam
scrollback_lines 10000
enable_audio_bell no

# ── Pestañas (sin barra) ──
tab_bar_style    hidden

# ── Colores (paleta de la escena) ──
background           #1a1a1a
foreground           #dcdcdc
cursor               #5c9ae6
selection_background #2a3340
selection_foreground #ffffff
color0               #1a1a1a
color8               #4d5159
color1               #d46a6a
color9               #e48a8a
color2               #8aa890
color10              #a5c0aa
color3               #c4b07a
color11              #d9c795
color4               #6f93c4
color12              #8fb0e0
color5               #9a92c4
color13              #b3acd8
color6               #78a6b8
color14              #9ac0d0
