# ── Fuente ──
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.0

# ── Ventana ──
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size yes
background_opacity 0.95

# ── Cursor y scroll ──
cursor_shape     beam
scrollback_lines 10000
enable_audio_bell no

# ── Pestañas (sin barra) ──
tab_bar_style    hidden

# ── Colores (paleta de la escena) ──
background       #0d0f1a
foreground       #c9d1f5
cursor           #5fd3ff
selection_background #2a2f4a
selection_foreground #c9d1f5
color0  #1e2233
color8  #4c5275
color1  #ff6b9d
color9  #ff8fb3
color2  #7ee8a2
color10 #9fffc0
color3  #ffd27a
color11 #ffe3a3
color4  #5fd3ff
color12 #8fe3ff
color5  #b48cff
color13 #cdb4ff
color6  #6fd8e0
color14 #9ff0f5
color7  #c9d1f5
color15 #eef1ff
