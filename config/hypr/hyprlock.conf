# Hyprlock · monocromo: hora serif protagonista, interfaz en Inter, avatar
# Copias: hyprlock.conf.bak-20261107-islas (original) … -v5 (con barra superior)
# Fondo: ~/.local/state/fondos/bloqueo.png (inicial: lock-torres.png) · Avatar: ~/Pictures/avatar.png

general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/m1ke/.local/state/fondos/bloqueo.png   # lo cambia «fondo bloqueo» (tecla b en el selector)
    blur_passes = 0
}

# ── Hora + fecha ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = rgba(255, 255, 255, 0.96)
    font_size = 140
    font_family = DM Serif Display
    position = 0, 215
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.45)
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %-d de %B')"
    color = rgba(200, 200, 200, 0.8)
    font_size = 18
    font_family = Inter Display Medium
    position = 0, 98
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)
}

# ── Usuario ──
image {
    monitor =
    path = /home/m1ke/Pictures/avatar.png
    size = 100
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.6)
    position = 0, -30
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.5)
}

label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.92)
    font_size = 17
    font_family = Inter Display SemiBold
    position = 0, -112
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.4)
}

# ── Contraseña: cristal ──
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    rounding = 12
    dots_size = 0.18
    dots_spacing = 0.45
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(40, 40, 40, 0.62)
    font_color = rgba(240, 240, 240, 1.0)
    check_color = rgba(255, 255, 255, 0.5)
    fail_color = rgba(208, 102, 90, 1.0)
    capslock_color = rgba(217, 165, 91, 1.0)
    font_family = Inter Display Medium
    fade_on_empty = false
    placeholder_text = <span foreground="##9a9a9a">Contraseña</span>
    fail_text = <span foreground="##e07a6e">Incorrecta</span>
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.4)
    position = 0, -185
    halign = center
    valign = center
}
