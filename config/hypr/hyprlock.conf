general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = /home/m1ke/Pictures/wallpapers/cyberroom.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = rgba(201, 209, 245, 1.0)
    font_size = 96
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgba(95, 211, 255, 1.0)
    inner_color = rgba(13, 15, 26, 0.9)
    font_color = rgba(201, 209, 245, 1.0)
    fade_on_empty = true
    placeholder_text = <span foreground="##5fd3ff">contraseña</span>
    position = 0, -40
    halign = center
    valign = center
}
