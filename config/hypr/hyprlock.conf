general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/m1ke/Pictures/wallpapers/nuevo.png
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.2
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = rgba(236, 236, 236, 1.0)
    font_size = 110
    font_family = Inter Display Light
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %-d de %B')"
    color = rgba(255, 255, 255, 0.95)
    font_size = 20
    font_family = Inter Display Medium
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    rounding = 23
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.85)
    inner_color = rgba(26, 26, 26, 0.72)
    check_color = rgba(199, 128, 88, 1.0)
    fail_color = rgba(100, 19, 15, 1.0)
    font_color = rgba(236, 236, 236, 1.0)
    font_family = Inter Display Medium
    fade_on_empty = false
    placeholder_text = <span foreground="##8c8c8c">Contraseña</span>
    fail_text = <span foreground="##ff6b8a">Incorrecta</span>
    position = 0, -60
    halign = center
    valign = center
}
