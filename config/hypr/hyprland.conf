# ── Monitores (detección automática) ──
monitor = HDMI-A-1, 1920x1080@74.97, 0x0, 1
monitor = , preferred, auto, 1

# ── Autostart ──
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = swaybg -m fill -i /home/m1ke/Pictures/wallpapers/nuevo.png
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ── Entorno NVIDIA ──
env = LIBVA_DRIVER_NAME,nvidia
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = WLR_NO_HARDWARE_CURSORS,1
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice

# ── Teclado ──
input {
    kb_layout = es
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
}

# ── Apariencia (ligera) ──
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    resize_on_border = true
    extend_border_grab_area = 15
    col.active_border = rgba(ffffffee) rgba(8c8c8cee) 45deg
    col.inactive_border = rgba(323232aa)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.97
    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.2
        ignore_opacity = true
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000088)
    }
}

# Blur también en la barra y el lanzador
layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace rofi

animations {
    enabled = true
    bezier = snap, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 1.5, snap, popin 90%
    animation = windowsOut, 1, 1.5, snap, popin 90%
    animation = fade, 1, 1, snap
    animation = workspaces, 1, 1.5, snap, slide
    animation = border, 1, 2, snap
    animation = layers, 1, 1.5, snap, fade
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
}

# ── Atajos ──
$mod = SUPER

# Aplicaciones
bind = $mod, Return, exec, kitty
bind = CTRL ALT, T, exec, kitty
bind = $mod, E, exec, nautilus
bind = $mod, D, exec, rofi -show drun
bind = ALT, SPACE, exec, rofi -show drun
bind = $mod, Tab, exec, rofi -show window
bind = $mod, R, exec, rofi -show run

# Menús y utilidades
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, V, exec, ~/.local/bin/rofi-clipboard
bind = $mod, period, exec, rofi -modi emoji -show emoji
bind = $mod, W, exec, ~/.local/bin/rofi-wifi
bind = $mod, B, exec, ~/.local/bin/rofi-bluetooth
bind = $mod, Escape, exec, ~/.local/bin/rofi-power

# Ventanas
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, P, pseudo
bind = $mod, J, layoutmsg, togglesplit

# Foco y movimiento
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Capturas: sin editor. Guardan en ~/Pictures/Screenshots y copian al portapapeles
bind = CTRL ALT, S, exec, ~/.local/bin/screenshot region
bind = CTRL ALT, K, exec, ~/.local/bin/screenshot full
bind = $mod, S, exec, ~/.local/bin/screenshot region

# Volumen con Ctrl+Alt+flechas (±5%)
bindel = CTRL ALT, up, exec, wpctl set-volume -l 0.9 @DEFAULT_AUDIO_SINK@ 5%+
bindel = CTRL ALT, down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Sesión
bind = $mod SHIFT, E, exit

# Multimedia (sin modificador)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 0.9 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Ratón: mover y redimensionar con Super + botón
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
